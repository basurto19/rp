services:
  - type: web
    name: erp-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @erp/api... run build
    startCommand: pnpm --filter @erp/api run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: erp-system
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_MAX
        value: 100
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000

  - type: web
    name: erp-web
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @erp/web... run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: ERP_API_BASE_URL
        sync: false
